<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>结构化审核工作台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Review Console</p>
        <h1>结构化对照审核台</h1>
        <p class="hero-text">左侧看原始 PDF，右侧审查 <code>chunk / formula / table</code>。每条支持三态审核与备注历史，记录持久化到本地文件。</p>
      </div>
      <div class="hero-meta" id="heroMeta"></div>
    </header>

    <nav class="top-nav">
      <button type="button" id="navReview" class="is-active">审核工作台</button>
      <button type="button" id="navFlow">流程详图</button>
    </nav>

    <main>
      <section id="reviewSection" class="panel-section">
        <div class="control-bar">
          <div class="control-group">
            <label for="chapterSelect">章节</label>
            <select id="chapterSelect"></select>
          </div>
          <div class="control-group">
            <label>视图</label>
            <div id="viewTabs" class="segmented"></div>
          </div>
          <div class="control-group">
            <label for="statusFilter">筛选</label>
            <select id="statusFilter">
              <option value="all">全部状态</option>
              <option value="pending">待确认</option>
              <option value="fail">不通过</option>
              <option value="pass">通过</option>
            </select>
          </div>
          <div class="control-group stretch">
            <label for="searchInput">检索</label>
            <input id="searchInput" type="text" placeholder="按编号、标题、关键词搜索">
          </div>
        </div>

        <div class="stats-grid" id="reviewStats"></div>

        <div class="review-shell">
          <section class="pdf-pane">
            <div class="pdf-toolbar">
              <div class="toolbar-group">
                <button type="button" id="pdfPrev">上一页</button>
                <button type="button" id="pdfNext">下一页</button>
                <span id="pdfPageInfo" class="small-text">- / -</span>
              </div>
              <div class="toolbar-group">
                <button type="button" id="pdfZoomOut">-</button>
                <button type="button" id="pdfZoomIn">+</button>
                <button type="button" id="pdfFitToggle">适配视口</button>
                <button type="button" id="pdfRelocate">重新定位</button>
              </div>
            </div>
            <details class="candidate-panel" id="candidatePanel">
              <summary>定位候选页 <span id="candidateSummary" class="small-text">暂无</span></summary>
              <div class="candidate-strip" id="candidatePages"></div>
            </details>
            <div class="pdf-stage" id="pdfStage">
              <canvas id="pdfCanvas"></canvas>
              <div id="pdfHighlights" class="pdf-highlights"></div>
              <div id="chunkLegend" class="chunk-legend is-hidden"></div>
              <div id="formulaAuditOverlay" class="formula-audit-overlay is-hidden"></div>
              <div id="pdfStatus" class="pdf-status">等待载入 PDF…</div>
            </div>
          </section>

          <section class="review-pane">
            <div class="item-browser">
              <div class="browser-header">
                <h3 id="itemListTitle">条目列表</h3>
                <div class="item-nav">
                  <button type="button" id="itemListToggle">展开列表</button>
                  <button type="button" id="itemPrev">上一条 (K)</button>
                  <button type="button" id="itemNext">下一条 (J)</button>
                  <span id="itemListCount" class="small-text">0</span>
                </div>
              </div>
              <div id="itemList" class="item-list"></div>
            </div>

            <article class="review-detail" id="reviewDetail">
              <div class="placeholder">请选择条目开始审核。</div>
            </article>
          </section>
        </div>
      </section>

      <section id="flowSection" class="panel-section hidden">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Full Pipeline</p>
            <h2>全流程详图</h2>
            <p>主链路展示从 OCR 输入到结构化输出的完整过程；下方可展开公式、表格、chunk 子流程。</p>
          </div>
        </div>

        <div id="flowOverview" class="flow-grid"></div>
        <div class="control-bar compact">
          <div id="subflowTabs" class="segmented"></div>
        </div>
        <div id="subflowDetail" class="pipeline-grid"></div>

        <article class="detail-card">
          <div class="card-header">
            <h3>当前风险点</h3>
          </div>
          <div id="flowRisks" class="stack-list"></div>
        </article>
      </section>
    </main>
  </div>
</body>
</html>
